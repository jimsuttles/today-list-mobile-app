name: TodayList
options:
  bundleIdPrefix: com.fourctech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TodayList:
    type: application
    platform: iOS
    sources:
      - path: TodayList
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist
        INFOPLIST_FILE: TodayList/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Today List
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSUserTrackingUsageDescription: Today List uses this identifier to show relevant ads if you have not removed ads.
        CODE_SIGN_ENTITLEMENTS: TodayList/TodayList.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: TodayListWidget
    scheme:
      testTargets:
        - TodayListTests
    info:
      path: TodayList/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.fourctech.todaylist
            CFBundleURLSchemes:
              - todaylist
        UIBackgroundModes:
          - remote-notification
  TodayListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TodayListTests
    dependencies:
      - target: TodayList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist.tests
        GENERATE_INFOPLIST_FILE: YES
  TodayListWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TodayListWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist.widget
        INFOPLIST_FILE: TodayListWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TodayListWidget/TodayListWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
    info:
      path: TodayListWidget/Info.plist
      properties:
        CFBundleDisplayName: Today
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  TodayList:
    build:
      targets:
        TodayList: all
        TodayListWidget: all
    test:
      targets:
        - TodayListTests
