name: TodayList
options:
  bundleIdPrefix: com.fourctech
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "12"
packages:
  ProductivitySuiteCore:
    url: https://github.com/jimsuttles/productivity-suite-core.git
    branch: main
targets:
  TodayList:
    type: application
    platform: iOS
    sources:
      - path: TodayList
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist
        INFOPLIST_FILE: TodayList/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Today List
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TodayList/TodayList.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "X6T2496428"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: ProductivitySuiteCore
      - target: TodayListWidget
      - target: TodayListWatchApp
        embed: true
    scheme:
      testTargets:
        - TodayListTests
    info:
      path: TodayList/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.fourctech.todaylist
            CFBundleURLSchemes:
              - todaylist
        UIBackgroundModes:
          - remote-notification

  TodayListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TodayListTests
    dependencies:
      - target: TodayList
      - package: ProductivitySuiteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist.tests
        GENERATE_INFOPLIST_FILE: YES

  TodayListWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TodayListWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist.widget
        INFOPLIST_FILE: TodayListWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TodayListWidget/TodayListWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "X6T2496428"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
    info:
      path: TodayListWidget/Info.plist
      properties:
        CFBundleDisplayName: Today
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  TodayListWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: TodayListWatchApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist.watchkitapp
        INFOPLIST_FILE: TodayListWatchApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Today List
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.fourctech.todaylist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TodayListWatchApp/TodayListWatchApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "X6T2496428"
        SKIP_INSTALL: YES
    dependencies:
      - target: TodayListWatchWidget
        embed: true
    info:
      path: TodayListWatchApp/Info.plist
      properties:
        CFBundleDisplayName: Today List
        CFBundleIconName: AppIcon
        WKCompanionAppBundleIdentifier: com.fourctech.todaylist

  TodayListWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: TodayListWatchWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourctech.todaylist.watchkitapp.widgets
        INFOPLIST_FILE: TodayListWatchWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TodayListWatchWidget/TodayListWatchWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "X6T2496428"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
    info:
      path: TodayListWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Today
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  TodayList:
    build:
      targets:
        TodayList: all
    test:
      targets:
        - TodayListTests
